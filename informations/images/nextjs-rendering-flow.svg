<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 8; }
    .box2 { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
    .box3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .cache { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; stroke-dasharray: 4,3; rx: 8; }
    .label { font-size: 14px; fill: #1f2937; text-anchor: middle; }
    .small { font-size: 11px; fill: #4b5563; text-anchor: middle; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#a1); }
  </style>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="120" height="50" class="box"/>
  <text x="80" y="60" class="label">Przeglądarka</text>

  <rect x="200" y="30" width="150" height="50" class="box"/>
  <text x="275" y="55" class="label">CDN / Edge</text>
  <text x="275" y="70" class="small">Router Cache (klient)</text>

  <rect x="410" y="30" width="180" height="50" class="box3"/>
  <text x="500" y="55" class="label">Next.js Server</text>
  <text x="500" y="70" class="small">Node.js / Edge Runtime</text>

  <rect x="650" y="30" width="220" height="50" class="cache"/>
  <text x="760" y="55" class="label">Full Route Cache</text>
  <text x="760" y="70" class="small">HTML + RSC payload dla statycznych tras</text>

  <rect x="410" y="140" width="180" height="55" class="box2"/>
  <text x="500" y="163" class="label">React Server</text>
  <text x="500" y="178" class="small">Components (render)</text>

  <rect x="650" y="140" width="220" height="55" class="cache"/>
  <text x="760" y="163" class="label">Data Cache</text>
  <text x="760" y="178" class="small">wynik fetch() – persist / revalidate</text>

  <rect x="410" y="240" width="180" height="50" class="cache"/>
  <text x="500" y="263" class="label">Request Memoization</text>
  <text x="500" y="277" class="small">dedup fetch w 1 renderze</text>

  <rect x="650" y="240" width="220" height="50" class="box"/>
  <text x="760" y="265" class="label">Źródła danych</text>
  <text x="760" y="278" class="small">DB, CMS, zewnętrzne API</text>

  <rect x="200" y="330" width="150" height="50" class="box2"/>
  <text x="275" y="352" class="label">Client Components</text>
  <text x="275" y="367" class="small">hydracja, interaktywność</text>

  <rect x="410" y="330" width="180" height="50" class="box3"/>
  <text x="500" y="352" class="label">Server Actions</text>
  <text x="500" y="367" class="small">mutacje danych, formularze</text>

  <path class="arrow" d="M140,55 L200,55"/>
  <path class="arrow" d="M350,55 L410,55"/>
  <path class="arrow" d="M590,55 L650,55"/>
  <path class="arrow" d="M500,80 L500,140"/>
  <path class="arrow" d="M590,167 L650,167"/>
  <path class="arrow" d="M500,195 L500,240"/>
  <path class="arrow" d="M590,265 L650,265"/>

  <path class="arrow" d="M275,80 L275,330"/>
  <path class="arrow" d="M350,355 L410,355"/>
  <path class="arrow" d="M500,380 L500,410 L300,410 L300,380"/>

  <text x="450" y="440" class="small" font-size="12">4 warstwy cache w App Routerze: Request Memoization → Data Cache → Full Route Cache → Router Cache (przeglądarka)</text>
  <text x="450" y="458" class="small" font-size="12">Client Components hydrują się w przeglądarce; Server Actions pozwalają wywołać mutacje bez ręcznego API route</text>
</svg>
