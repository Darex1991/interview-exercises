<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .subject { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
    .observer { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
    .label { font-size: 14px; fill: #1f2937; text-anchor: middle; }
    .small { font-size: 11px; fill: #4b5563; text-anchor: middle; }
    .notify { stroke: #ea580c; stroke-width: 2; fill: none; marker-end: url(#a3); }
    .sub { stroke: #9ca3af; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#a4); }
  </style>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="a4" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="290" y="30" width="200" height="80" class="subject"/>
  <text x="390" y="58" class="label" font-weight="bold">Subject</text>
  <text x="390" y="76" class="small">(EventEmitter / Store)</text>
  <text x="390" y="93" class="small">listeners: [A, B, C]</text>

  <rect x="60" y="220" width="170" height="60" class="observer"/>
  <text x="145" y="245" class="label">Observer A</text>
  <text x="145" y="262" class="small">np. komponent UI</text>

  <rect x="305" y="220" width="170" height="60" class="observer"/>
  <text x="390" y="245" class="label">Observer B</text>
  <text x="390" y="262" class="small">np. logger</text>

  <rect x="550" y="220" width="170" height="60" class="observer"/>
  <text x="635" y="245" class="label">Observer C</text>
  <text x="635" y="262" class="small">np. analytics</text>

  <path class="sub" d="M145,220 C145,160 250,120 300,105"/>
  <path class="sub" d="M390,220 L390,110"/>
  <path class="sub" d="M635,220 C635,160 530,120 480,105"/>

  <path class="notify" d="M320,110 C260,150 190,180 155,220"/>
  <path class="notify" d="M390,110 L390,220"/>
  <path class="notify" d="M460,110 C520,150 590,180 625,220"/>

  <text x="390" y="330" class="small" font-size="12">Przerywana szara strzałka = subskrypcja: <tspan font-family="Courier New, monospace">observer.subscribe(subject)</tspan></text>
  <text x="390" y="352" class="small" font-size="12">Pomarańczowa strzałka = powiadomienie: <tspan font-family="Courier New, monospace">subject.notify(data)</tspan> / <tspan font-family="Courier New, monospace">emit(event)</tspan></text>
  <text x="390" y="385" class="small" font-size="12">Subject nie wie nic o konkretnych typach observerów — tylko o tym, że mają metodę do wywołania.</text>
  <text x="390" y="403" class="small" font-size="12">Dzięki temu można dodawać/usuwać observery w runtime bez zmiany kodu Subject.</text>
</svg>
