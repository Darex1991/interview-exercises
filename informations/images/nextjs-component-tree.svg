<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Helvetica, Arial, sans-serif">
  <style>
    .server { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
    .client { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .label { font-size: 13px; fill: #1f2937; text-anchor: middle; }
    .small { font-size: 10.5px; fill: #4b5563; text-anchor: middle; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
  </style>

  <rect x="320" y="20" width="160" height="50" class="server"/>
  <text x="400" y="42" class="label">layout.tsx</text>
  <text x="400" y="57" class="small">Server Component</text>

  <rect x="320" y="110" width="160" height="50" class="server"/>
  <text x="400" y="132" class="label">page.tsx</text>
  <text x="400" y="147" class="small">Server Component (fetch danych)</text>

  <rect x="120" y="200" width="170" height="50" class="server"/>
  <text x="205" y="222" class="label">ProductList</text>
  <text x="205" y="237" class="small">Server Component</text>

  <rect x="330" y="200" width="170" height="50" class="client"/>
  <text x="415" y="220" class="label">SearchBar</text>
  <text x="415" y="235" class="small">"use client" – interaktywność</text>

  <rect x="540" y="200" width="170" height="50" class="server"/>
  <text x="625" y="222" class="label">Sidebar</text>
  <text x="625" y="237" class="small">Server Component</text>

  <rect x="330" y="290" width="170" height="50" class="client"/>
  <text x="415" y="310" class="label">AddToCartButton</text>
  <text x="415" y="325" class="small">"use client" – stan lokalny</text>

  <path class="arrow" d="M400,70 L400,110"/>
  <path class="arrow" d="M400,160 L205,200"/>
  <path class="arrow" d="M400,160 L415,200"/>
  <path class="arrow" d="M400,160 L625,200"/>
  <path class="arrow" d="M415,250 L415,290"/>

  <text x="400" y="360" class="small" font-size="12">Zielony = Server Component (domyślnie, render po stronie serwera, 0 JS do klienta); Pomarańczowy = Client Component (granica "use client", hydratacja w przeglądarce)</text>
</svg>
