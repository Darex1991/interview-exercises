<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 8; }
    .svc { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
    .db { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 6; }
    .bus { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .label { font-size: 14px; fill: #1f2937; text-anchor: middle; }
    .small { font-size: 11px; fill: #4b5563; text-anchor: middle; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead2); }
    .darrow { stroke: #ea580c; stroke-width: 2; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrowhead3); }
  </style>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="30" y="40" width="130" height="50" class="box"/>
  <text x="95" y="70" class="label">Klient (Web/App)</text>

  <rect x="230" y="40" width="160" height="50" class="box"/>
  <text x="310" y="65" class="label">API Gateway</text>
  <text x="310" y="80" class="small">routing, auth, agregacja</text>

  <rect x="230" y="140" width="160" height="55" class="svc"/>
  <text x="310" y="165" class="label">Serwis: Users</text>
  <text x="310" y="180" class="small">własna baza</text>

  <rect x="420" y="140" width="160" height="55" class="svc"/>
  <text x="500" y="165" class="label">Serwis: Orders</text>
  <text x="500" y="180" class="small">własna baza</text>

  <rect x="610" y="140" width="160" height="55" class="svc"/>
  <text x="690" y="165" class="label">Serwis: Payments</text>
  <text x="690" y="180" class="small">własna baza</text>

  <rect x="255" y="240" width="110" height="45" class="db"/>
  <text x="310" y="268" class="small">Users DB</text>

  <rect x="445" y="240" width="110" height="45" class="db"/>
  <text x="500" y="268" class="small">Orders DB</text>

  <rect x="635" y="240" width="110" height="45" class="db"/>
  <text x="690" y="268" class="small">Payments DB</text>

  <rect x="380" y="330" width="230" height="50" class="bus"/>
  <text x="495" y="355" class="label">Message Broker (Kafka/RabbitMQ)</text>
  <text x="495" y="370" class="small">zdarzenia: OrderCreated, PaymentDone</text>

  <rect x="30" y="420" width="160" height="50" class="svc"/>
  <text x="110" y="450" class="label">Service Registry</text>

  <rect x="700" y="420" width="170" height="50" class="svc"/>
  <text x="785" y="445" class="label">Observability</text>
  <text x="785" y="460" class="small">logi, metryki, tracing</text>

  <path class="arrow" d="M160,65 L230,65"/>
  <path class="arrow" d="M310,90 L310,140"/>
  <path class="arrow" d="M310,90 L500,140"/>
  <path class="arrow" d="M310,90 L690,140"/>

  <path class="arrow" d="M310,195 L310,240"/>
  <path class="arrow" d="M500,195 L500,240"/>
  <path class="arrow" d="M690,195 L690,240"/>

  <path class="darrow" d="M500,195 L495,330"/>
  <path class="darrow" d="M690,195 L610,340"/>
  <path class="darrow" d="M495,330 L310,195"/>

  <text x="450" y="480" class="small" font-size="12">Ciągła strzałka = wywołanie synchroniczne (REST/gRPC); przerywana pomarańczowa = komunikacja asynchroniczna (zdarzenia)</text>
</svg>
