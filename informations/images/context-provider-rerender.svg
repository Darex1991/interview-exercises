<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Helvetica, Arial, sans-serif">
  <style>
    .provider { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
    .affected { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .unaffected { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
    .label { font-size: 13px; fill: #1f2937; text-anchor: middle; }
    .small { font-size: 10.5px; fill: #4b5563; text-anchor: middle; }
    .arrow { stroke: #ea580c; stroke-width: 2; fill: none; marker-end: url(#a6); }
  </style>
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="280" y="20" width="220" height="70" class="provider"/>
  <text x="390" y="48" class="label" font-weight="bold">AppContext.Provider</text>
  <text x="390" y="65" class="small">value = { user, theme }</text>

  <rect x="60" y="180" width="180" height="60" class="affected"/>
  <text x="150" y="205" class="label">Header</text>
  <text x="150" y="222" class="small">używa "user"</text>

  <rect x="300" y="180" width="180" height="60" class="affected"/>
  <text x="390" y="205" class="label">Sidebar</text>
  <text x="390" y="222" class="small">używa "theme"</text>

  <rect x="540" y="180" width="180" height="60" class="affected"/>
  <text x="630" y="205" class="label">Footer</text>
  <text x="630" y="222" class="small">nie używa danych z kontekstu wcale</text>

  <path class="arrow" d="M330,90 L150,180"/>
  <path class="arrow" d="M390,90 L390,180"/>
  <path class="arrow" d="M450,90 L630,180"/>

  <text x="390" y="290" class="small" font-size="12">Zmiana pojedynczego pola w "value" (np. tylko "user") re-renderuje</text>
  <text x="390" y="308" class="small" font-size="12">WSZYSTKICH konsumentów Providera — również Footer, który nie czyta zmienionej wartości.</text>
  <text x="390" y="335" class="small" font-size="12">Rozwiązania: podziel jeden duży kontekst na kilka mniejszych (per domena danych),</text>
  <text x="390" y="353" class="small" font-size="12">memoizuj "value" (useMemo), albo dla często zmieniających się danych użyj Zustand/Redux z selektorami.</text>
</svg>
