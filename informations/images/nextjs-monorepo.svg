<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif">
  <style>
    .app { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 8; }
    .pkg { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
    .cfg { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .label { font-size: 13px; fill: #1f2937; text-anchor: middle; }
    .small { font-size: 10.5px; fill: #4b5563; text-anchor: middle; }
    .code { font-size: 10.5px; fill: #4b5563; text-anchor: middle; font-family: "Courier New", monospace; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="150" y="30" class="label" font-weight="bold" font-size="15">apps/</text>
  <rect x="30" y="45" width="150" height="55" class="app"/>
  <text x="105" y="68" class="label">web</text>
  <text x="105" y="83" class="small">Next.js – sklep</text>

  <rect x="30" y="115" width="150" height="55" class="app"/>
  <text x="105" y="138" class="label">admin</text>
  <text x="105" y="153" class="small">Next.js – panel CMS</text>

  <rect x="30" y="185" width="150" height="55" class="app"/>
  <text x="105" y="208" class="label">docs</text>
  <text x="105" y="223" class="small">Next.js – dokumentacja</text>

  <text x="480" y="30" class="label" font-weight="bold" font-size="15">packages/</text>

  <rect x="340" y="45" width="160" height="55" class="pkg"/>
  <text x="420" y="68" class="label">ui</text>
  <text x="420" y="83" class="small">design system</text>

  <rect x="340" y="115" width="160" height="55" class="pkg"/>
  <text x="420" y="138" class="label">api-client</text>
  <text x="420" y="153" class="small">klient do backendu</text>

  <rect x="340" y="185" width="160" height="55" class="pkg"/>
  <text x="420" y="208" class="label">config</text>
  <text x="420" y="223" class="small">eslint, tsconfig</text>

  <rect x="560" y="115" width="180" height="55" class="cfg"/>
  <text x="650" y="138" class="label">tooling</text>
  <text x="650" y="153" class="small">turbo.json, workspaces</text>

  <path class="arrow" d="M180,70 L340,70"/>
  <path class="arrow" d="M180,80 L340,130"/>
  <path class="arrow" d="M180,90 L340,210"/>

  <path class="arrow" d="M180,145 L340,72"/>
  <path class="arrow" d="M180,140 L340,140"/>
  <path class="arrow" d="M180,155 L340,212"/>

  <path class="arrow" d="M180,215 L340,72"/>
  <path class="arrow" d="M180,225 L340,215"/>

  <path class="arrow" d="M560,140 L500,140" stroke-dasharray="4,3"/>

  <rect x="40" y="280" width="740" height="220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="410" y="312" class="label" font-weight="bold" font-size="14">Cache buildów (Turborepo)</text>

  <text x="410" y="345" class="code">$ turbo run build --filter=...[main]</text>

  <text x="410" y="378" class="small">
    <tspan x="410" dy="0">1. Zmienił się tylko "web" i "ui"</tspan>
    <tspan x="410" dy="16">→ rebuild tylko web + ui</tspan>
  </text>

  <text x="410" y="430" class="small">
    <tspan x="410" dy="0">2. "admin" i "api-client" bez zmian</tspan>
    <tspan x="410" dy="16">→ wynik z cache (lokalny lub remote)</tspan>
  </text>

  <text x="410" y="482" class="small">
    <tspan x="410" dy="0">3. Build/lint/test tylko dla dotkniętych pakietów</tspan>
    <tspan x="410" dy="16">→ szybkie CI nawet w dużym repo</tspan>
  </text>

  <text x="410" y="540" class="small" font-size="12">
    <tspan x="410" dy="0">Strzałki = zależności (import) aplikacji od pakietów współdzielonych;</tspan>
    <tspan x="410" dy="18">przerywana = zależność narzędziowa (devDependency)</tspan>
  </text>
</svg>
